*{box-sizing:border-box}

.step{height:150vh}

#ctl button{width:36px;height:36px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--fg);font:500 14px var(--mono);cursor:pointer;display:grid;place-items:center}
#ctl button:hover{border-color:var(--line);background:rgba(255,255,255,.04)}
#ctl .dots{display:flex;gap:6px;padding:0 6px}
#ctl .dots button{width:22px;height:22px}
#ctl .dots i{display:block;width:6px;height:6px;border-radius:50%;background:var(--fg-2);opacity:.45}
#ctl .dots button.on i{background:var(--yellow);opacity:1;transform:scale(1.3)}

#contact.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#contact span{font:500 14px var(--mono)}
.btn{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:6px;font:500 13px var(--mono);text-decoration:none;border:1px solid var(--line);color:var(--fg);background:transparent;cursor:pointer}
.btn.y{background:var(--yellow);border-color:var(--yellow);color:#14120A}
.btn:hover{border-color:var(--blue)}
.hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;font:12px var(--mono);color:var(--fg-2);display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .4s;pointer-events:none}

@media (prefers-reduced-motion:reduce){.hint i{animation:none}}
@media (max-width:600px){#contact{max-width:calc(100% - 32px);bottom:max(70px,env(safe-area-inset-bottom,0px))}}

  function drawOut(a){ drawName(a,nameWidth()*.7,COL.yellow,-.04*U); g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=rgba(COL.grey,a); serif(U*.045,400,true); g.fillText('ŷ  =',FX-nameWidth()*.47,FY-.04*U); mono(Math.max(11,U*.02)); g.fillText('argmax ŷ  →  open to opportunities',FX,FY+.09*U); }
  var draws=[drawHero,drawNet,drawMat,drawDom,drawAch,drawOut];

  /* ===================== SCROLL + AUTOPLAY ===================== */
  var p=0,pT=0,mx=0,my=0, auto=!reduce, autoP=0, lastT=null, HOLD=6, MORPH=2.8;
  var doc=document.documentElement; function maxScroll(){ return doc.scrollHeight-doc.clientHeight||1; }
  addEventListener('scroll',function(){ if(!scrollingByCode) { pT=doc.scrollTop/maxScroll(); } },{passive:true});
  var scrollingByCode=false; function setP(v){ pT=clamp(v,0,1); autoP=pT; scrollingByCode=true; doc.scrollTop=pT*maxScroll(); requestAnimationFrame(function(){ scrollingByCode=false; }); }
  function pause(){ auto=false; play.textContent='▶'; play.setAttribute('aria-label','Play'); play.setAttribute('aria-pressed','false'); hz.textContent='scroll · ▶ to resume'; }
  function resume(){ auto=true; autoP=pT; play.textContent='❚❚'; play.setAttribute('aria-label','Pause'); play.setAttribute('aria-pressed','true'); hz.textContent='auto · scroll to take over'; }
  addEventListener('wheel',function(){ if(auto) pause(); },{passive:true}); addEventListener('touchmove',function(){ if(auto) pause(); },{passive:true}); addEventListener('keydown',function(e){ if(['ArrowDown','ArrowUp','PageDown','PageUp',' '].indexOf(e.key)>=0&&auto) pause(); });
  addEventListener('pointermove',function(e){ mx=e.clientX/W-.5; my=e.clientY/H-.5; },{passive:true});
  var play=document.getElementById('play'), dots=document.getElementById('dots'), dotBtns=[];
  for(var d=0;d<SCENES;d++){ var b=document.createElement('button'); b.type='button'; b.setAttribute('aria-label','Go to '+names[d]); b.innerHTML='<i></i>'; b.dataset.i=d; b.addEventListener('click',function(){ pause(); setP(+this.dataset.i/(SCENES-1)); }); dots.appendChild(b); dotBtns.push(b); }
  play.addEventListener('click',function(){ auto?pause():resume(); });
  document.getElementById('prev').addEventListener('click',function(){ pause(); var i=Math.round(pT*(SCENES-1)); setP(Math.max(0,i-1)/(SCENES-1)); });
  document.getElementById('next').addEventListener('click',function(){ pause(); var i=Math.round(pT*(SCENES-1)); setP(Math.min(SCENES-1,i+1)/(SCENES-1)); });
  /* autoplay: hold on a picture, then spend MORPH seconds crossing to the next; loop at the end */
  function stepAuto(dt){ var seg=1/(SCENES-1), s=autoP*(SCENES-1), i=Math.floor(s+1e-6), tt=s-i; if(i>=SCENES-1){ holdT+=dt; if(holdT>HOLD){ holdT=0; p=0; pT=0; setP(0); } return; }
    if(tt<.3){ holdT+=dt; if(holdT>=HOLD){ holdT=0; autoP=(i+.3001)*seg; } } else { autoP+=dt/MORPH*.7*seg; if(autoP>=(i+1)*seg){ autoP=(i+1)*seg; } } setP(autoP); }
  var holdT=0;
  dispatchEvent(new Event('scroll'));

  /* ===================== FRAME ===================== */
  var t0=performance.now();
  function frame(t){
    requestAnimationFrame(frame); var time=(t-t0)/1000, dt=lastT?Math.min(.1,(t-lastT)/1000):0; lastT=t;
    if(auto) stepAuto(dt);
    p+=(pT-p)*(reduce?1:.09);
    var s=p*(SCENES-1), i=clamp(Math.floor(s),0,SCENES-2), tt=s-i; if(p>=.999){ i=SCENES-2; tt=1; }
    var k=sm((tt-.42)/.5), A=shapes[i], B=shapes[i+1], hold=1-sm((tt-.3)/.22), nextHold=sm((tt-.88)/.12);
    background(time); if(i>0||tt>.3) drawChips(.3,time); /* the tool chips keep drifting behind every picture */
    var pa=1-Math.max(hold,nextHold); if(pa>.01){ var par=mx*12, pary=my*8, dotR=1.5+Math.sin(Math.PI*k)*.7;
      for(var n=0;n<N;n++){ var kk=sm(k*1.3-(n/N)*.3), o=n*2, c=n*3, arc=Math.sin(Math.PI*kk)*.16*U; var x=A.p[o]+(B.p[o]-A.p[o])*kk+off[o]*arc, y=A.p[o+1]+(B.p[o+1]-A.p[o+1])*kk+off[o+1]*arc, depth=off[o]*.5+.5;
        g.fillStyle='rgba('+((A.c[c]+(B.c[c]-A.c[c])*kk)|0)+','+((A.c[c+1]+(B.c[c+1]-A.c[c+1])*kk)|0)+','+((A.c[c+2]+(B.c[c+2]-A.c[c+2])*kk)|0)+','+(pa*(.55+.45*depth))+')'; g.beginPath(); g.arc(FX+x+par*(depth-.5),FY+y+pary*(depth-.5),dotR*(.7+depth*.6),0,6.283); g.fill(); } }
    if(hold>.01){ draws[i](hold,time); drawCaption(hold,caps[i]); } if(nextHold>.01){ draws[i+1](nextHold,time); drawCaption(nextHold,caps[i+1]); }
    var sc=tt>.7?i+1:i; hl.textContent=names[sc]; dotBtns.forEach(function(b,j){ b.classList.toggle('on',j===sc); }); contact.classList.toggle('on',sc===SCENES-1&&nextHold+hold>.5);
    bar.style.width=(p*100)+'%'; hint.style.opacity=(p>.02||auto)?0:1;
  }
  requestAnimationFrame(frame);
  document.getElementById('copy').addEventListener('click',function(){ var b=this,t2=document.getElementById('email').textContent; function done(){ b.textContent='copied'; setTimeout(function(){ b.textContent='copy'; },1500); }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t2).then(done,function(){ var s=getSelection(),r=document.createRange(); r.selectNodeContents(document.getElementById('email')); s.removeAllRanges(); s.addRange(r); }); });
})();
</script>
