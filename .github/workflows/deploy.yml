# Deploy Astro portfolio to GitHub Pages
# Triggers on push to master or manual dispatch
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Weekly rebuild — refreshes GitHub stats + project READMEs without a code push.
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent racing deploys; allow current run to complete
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Injected automatically — reads THIS repo's public stats during build.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT (contents:read) scoped to the private portfolio repos
          # (booking, techleague) — lets prebuild pull their meta + README. Optional:
          # absent → those repos fall back to cache; build still succeeds.
          PORTFOLIO_READ_PAT: ${{ secrets.PORTFOLIO_READ_PAT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
