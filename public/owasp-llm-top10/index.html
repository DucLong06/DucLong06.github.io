<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OWASP LLM Top 10</title>
<meta name="description" content="OWASP Top 10 cho ứng dụng LLM (bản 2026), trình bày bởi Hoàng Đức Long.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one slide per screen, horizontal deck; left column = frame/label, right = content.
   Dark-first (projector), light theme follows the viewer. */
:root{
  --bg:#111418; --bg-2:#181d23; --panel:#1f252d; --line:#2c343e;
  --fg:#ece8df; --fg-2:#a9b0b9; --fg-3:#6e7681;
  --blue:#5b8cff; --blue-ink:#1c2f5e;
  --red:#ff5e5e; --red-ink:#4a1f22;
  --amber:#f2b53f; --amber-ink:#4a3a14;
  --green:#3ccf8e; --green-ink:#143f2f;
  --display:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f4ee; --bg-2:#ecebe4; --panel:#ffffff; --line:#d9d6cc;
    --fg:#161a1f; --fg-2:#4b535d; --fg-3:#8a9099;
    --blue:#2457d6; --blue-ink:#dbe5ff;
    --red:#d63a3a; --red-ink:#ffe1e1;
    --amber:#b7791a; --amber-ink:#fdeec9;
    --green:#1a8f5d; --green-ink:#d6f5e6;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f6f4ee; --bg-2:#ecebe4; --panel:#ffffff; --line:#d9d6cc;
  --fg:#161a1f; --fg-2:#4b535d; --fg-3:#8a9099;
  --blue:#2457d6; --blue-ink:#dbe5ff;
  --red:#d63a3a; --red-ink:#ffe1e1;
  --amber:#b7791a; --amber-ink:#fdeec9;
  --green:#1a8f5d; --green-ink:#d6f5e6;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);font-size:clamp(14px,1.25vw,18px);line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- deck ---- */
#deck{position:fixed;inset:0;overflow:hidden}
.slide{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr);padding-block:clamp(44px,7vh,72px) clamp(64px,9vh,84px);padding-left:max(24px,env(safe-area-inset-left,0px),5vw);padding-right:max(24px,env(safe-area-inset-right,0px),5vw);overflow:auto;opacity:0;visibility:hidden;transform:translateX(6%);transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1),visibility 0s .55s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1),visibility 0s}
.slide.out-left{transform:translateX(-6%)}
.slide>.in{width:100%;max-width:1180px;margin:auto;min-width:0}
/* staggered reveal */
.slide [data-a]{opacity:0;transform:translateY(14px)}
.slide.on [data-a]{animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 120ms)}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .slide,.slide.on{transition:none}
  .slide [data-a]{opacity:1;transform:none;animation:none!important}
  .mon .ln{animation:none!important;opacity:1!important}
  .caret{animation:none}
}

/* ---- chrome ---- */
#bar{position:fixed;top:0;left:0;height:3px;background:var(--blue);width:0;transition:width .4s;z-index:20}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px),5vw);padding-right:max(24px,env(safe-area-inset-right,0px),5vw);font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);z-index:15;pointer-events:none}
#top b{color:var(--fg-2);font-weight:500}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px),5vw);padding-right:max(24px,env(safe-area-inset-right,0px),5vw);z-index:15}
#nav .grp{display:flex;gap:8px;align-items:center}
#nav button{height:36px;min-width:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg-2);color:var(--fg-2);font-family:var(--mono);font-size:.8rem;transition:border-color .2s,color .2s}
#nav button:hover{border-color:var(--blue);color:var(--fg)}
#cnt{font-family:var(--mono);font-size:.8rem;color:var(--fg-3);font-variant-numeric:tabular-nums}
#hint{font-family:var(--mono);font-size:.7rem;color:var(--fg-3)}
#more{font-family:var(--mono);font-size:.74rem;color:var(--amber);background:var(--amber-ink);padding:4px 10px;border-radius:999px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
@media (max-width:700px){#hint,#top .r{display:none}}

/* ---- typography ---- */
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.eyebrow .tag{padding:3px 8px;border-radius:5px;font-weight:600;letter-spacing:.04em}
.tag.red{background:var(--red-ink);color:var(--red)}
.tag.blue{background:var(--blue-ink);color:var(--blue)}
.tag.green{background:var(--green-ink);color:var(--green)}
.tag.amber{background:var(--amber-ink);color:var(--amber)}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.12;letter-spacing:-.015em}
h1{font-size:clamp(2.2rem,6vw,5rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.2vw,2.5rem);font-weight:800;margin-top:.5rem}
h3{font-size:clamp(1.05rem,1.6vw,1.3rem);font-weight:600}
.lead{font-size:clamp(1rem,1.5vw,1.25rem);color:var(--fg-2);max-width:62ch;margin:.9rem 0 0}
.muted{color:var(--fg-3)}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-weight:600;color:var(--blue)}
.en{color:var(--fg-3);font-weight:400;font-size:.85em}

/* ---- title ---- */
.title-grid{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end}
.title-grid .brand{font-family:var(--mono);font-size:.85rem;color:var(--fg-3);letter-spacing:.1em;text-transform:uppercase}
.title-grid h1 span{display:block;color:var(--blue)}
.presenter{border-left:3px solid var(--blue);padding-left:16px}
.presenter .lbl{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3)}
.presenter .who{font-size:clamp(1.1rem,2vw,1.5rem);font-weight:600;margin-top:4px}
.tenchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.tenchips span{font-family:var(--mono);font-size:.72rem;padding:5px 9px;border:1px solid var(--line);border-radius:6px;color:var(--fg-2)}
@media (max-width:760px){.title-grid{grid-template-columns:1fr}}

/* ---- TOC ---- */
.toc{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:1.4rem}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toc li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.toc .part{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
.toc ol{gap:2px}
@media (max-height:820px){.toc .t small{display:none}.toc h2{margin-top:.2rem}}
.toc button{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:6px 12px;border-radius:8px;border:1px solid transparent;transition:background .2s,border-color .2s}
.toc button:hover{background:var(--bg-2);border-color:var(--line)}
.toc .k{font-family:var(--mono);font-size:.78rem;color:var(--blue);font-weight:600;min-width:5.2ch}
.toc .t{font-weight:500}
.toc .t small{display:block;font-weight:400;color:var(--fg-3);font-size:.78rem}
.toc .p{font-family:var(--mono);font-size:.72rem;color:var(--fg-3);font-variant-numeric:tabular-nums}
@media (max-width:760px){.toc{grid-template-columns:1fr}}

/* ---- divider ---- */
.divider .big{font-family:var(--mono);font-size:clamp(4rem,14vw,10rem);font-weight:600;color:var(--blue);line-height:1;opacity:.9}
.divider h2{font-size:clamp(1.8rem,4vw,3.2rem)}

/* ---- generic blocks ---- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:1.4rem;align-items:start}
.cols-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:1.4rem}
@media (max-width:860px){.cols,.cols-3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.card h3{margin-bottom:6px}
.card p{margin:.4rem 0 0;color:var(--fg-2)}
.card .kw{font-family:var(--mono);font-size:.74rem;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
.steps{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.steps .n{width:28px;height:28px;border-radius:50%;background:var(--blue-ink);color:var(--blue);font-family:var(--mono);font-weight:600;font-size:.8rem;display:grid;place-items:center}
.steps li.bad .n{background:var(--red-ink);color:var(--red)}
.steps li.good .n{background:var(--green-ink);color:var(--green)}
.steps p{margin:2px 0 0;color:var(--fg-2)}
.steps b{color:var(--fg);font-weight:600}
.callout{margin-top:1.2rem;padding:14px 18px;border-left:3px solid var(--amber);background:var(--bg-2);border-radius:0 10px 10px 0;color:var(--fg-2)}
.callout b{color:var(--fg)}
.srcline{margin-top:1.2rem;font-family:var(--mono);font-size:.74rem;color:var(--fg-3)}
.srcline a{color:var(--fg-2);text-decoration-color:var(--fg-3)}

/* ---- context window diagram ---- */
.ctx{margin-top:1.4rem;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg-2)}
.ctx .hdr{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-bottom:10px}
.tape{display:flex;gap:4px;flex-wrap:wrap}
.tape span{flex:1 1 auto;min-width:0;padding:10px 12px;border-radius:6px;font-family:var(--mono);font-size:.78rem;background:var(--panel);border:1px solid var(--line);color:var(--fg-2);text-align:center;white-space:nowrap}
.tape .sys{border-color:var(--blue);color:var(--blue)}
.tape .usr{border-color:var(--green);color:var(--green)}
.tape .evil{background:var(--red-ink);border-color:var(--red);color:var(--red)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:.82rem;color:var(--fg-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* tokens demo */
.tok{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tok span{font-family:var(--mono);font-size:.8rem;padding:4px 8px;border-radius:5px;background:var(--panel);border:1px solid var(--line)}
.prob{display:grid;gap:6px;margin-top:10px;font-family:var(--mono);font-size:.8rem}
.prob div{display:grid;grid-template-columns:10ch 1fr 5ch;gap:10px;align-items:center}
.prob i{display:block;height:10px;border-radius:3px;background:var(--blue);transform-origin:left;animation:grow 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
/* agent loop */
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:1rem;align-items:stretch}
.loop .node{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;position:relative}
.loop .node b{display:block;font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin-bottom:4px}
.loop .node:not(:last-child)::after{content:"→";position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--fg-3);font-size:1.1rem}
.loop .node.hot{border-color:var(--red)}
@media (max-width:760px){.loop{grid-template-columns:1fr 1fr}.loop .node::after{display:none}}
/* map of 10 */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:1.2rem}
.map .grp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.map .grp h3{font-size:1rem}
.map .grp .q{color:var(--fg-3);font-size:.82rem;margin:2px 0 10px}
.map ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.map li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:.9rem}
.map li .k{font-family:var(--mono);color:var(--blue);font-size:.78rem;font-weight:600;padding-top:2px}
.map li small{display:block;color:var(--fg-3);font-size:.78rem}
@media (max-width:860px){.map{grid-template-columns:1fr}}

/* ---- item slides ---- */
.item-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.item-head .name{font-size:clamp(1.5rem,3vw,2.3rem);font-weight:800;line-height:1.1}
.item-head .name small{display:block;font-weight:500;color:var(--fg-2);font-size:.55em;margin-top:4px}
.phase{display:flex;gap:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.phase span{padding:5px 10px;border-radius:6px;border:1px solid var(--line);color:var(--fg-3)}
.phase span.cur{border-color:var(--blue);color:var(--blue);background:var(--blue-ink)}
.quote{margin-top:1.2rem;padding:18px 22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;font-size:clamp(1rem,1.5vw,1.25rem);line-height:1.45}
.quote::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--red);border-radius:2px}
.quote .q{color:var(--fg)}
.quote .m{display:block;margin-top:8px;font-family:var(--mono);font-size:.74rem;color:var(--fg-3)}

/* demo: two views */
.demo{margin-top:1.2rem;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
@media (max-width:860px){.demo{grid-template-columns:1fr}}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.pane .ph{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.pane.llm{border-color:var(--red)}
.pane.llm .ph{color:var(--red)}
.pane .scene{font-size:.8rem;color:var(--fg-3);margin-bottom:6px}
.pane .l{padding:8px 10px;border-radius:8px;background:var(--bg-2);margin-top:6px;font-size:.92rem;color:var(--fg)}
.pane .l.hid{color:var(--fg-3);border:1px dashed var(--red);background:transparent;opacity:.75;font-style:italic;position:relative;padding-top:18px}
.pane .ghosttag{position:absolute;top:2px;left:10px;font-family:var(--mono);font-style:normal;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.pane .ghostnote{margin-top:10px;font-size:.78rem;color:var(--fg-3)}
.kw{font-family:var(--mono);font-size:.74rem;color:var(--blue);letter-spacing:.06em;text-transform:uppercase}
.case{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;margin-top:1rem;align-items:start}
.case-multi{display:grid;grid-template-columns:1fr;gap:16px;margin-top:1rem}
.shots{display:grid;gap:12px}
.shots.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.shot{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.shot img{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain;background:#fff}
.shots.three .shot img{max-height:22vh}
.shot figcaption{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;font-size:.84rem;color:var(--fg-2);line-height:1.35}
.shot figcaption .n{width:22px;height:22px;border-radius:50%;background:var(--red-ink);color:var(--red);font-family:var(--mono);font-weight:600;font-size:.72rem;display:grid;place-items:center}
.case .steps{margin-top:.6rem}
.case-multi .steps{margin-top:.6rem;grid-template-columns:repeat(3,1fr)}
.case-multi .steps li{align-content:start}
@media (max-width:860px){.case{grid-template-columns:1fr}.shots.three{grid-template-columns:1fr}.case-multi .steps{grid-template-columns:1fr}.shot img{max-height:none}}
.pane .l.mono{font-family:var(--mono);font-size:.84rem}
.pane .l.bad{color:var(--red);background:var(--red-ink)}
.pane .note{margin-top:auto;padding-top:12px;font-size:.84rem;color:var(--fg-2)}
.result{margin-top:14px;padding:14px 18px;border-radius:10px;background:var(--red-ink);color:var(--fg);display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline}
.result .k{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}

/* monitor */
.mon{background:#0b0e12;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-family:var(--mono);font-size:.84rem;color:#c9d1d9;min-width:0;overflow-x:auto}
:root[data-theme="light"] .mon{background:#1a1f26}
.mon .ph{color:#6e7681;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between}
.mon .ln{white-space:pre-wrap;opacity:0;padding:3px 0}
.slide.on .mon .ln{animation:type .35s steps(1) both;animation-delay:calc(var(--i,0)*.4s + .5s)}
@keyframes type{to{opacity:1}}
.mon .tg{color:#8fb3ff;display:inline-block;min-width:8ch}
.mon .ln.alert{color:#ffb4b4}
.mon .ln.block{color:#7fe0b2;font-weight:600}
.mon .caret{display:inline-block;width:.6ch;height:1em;background:#7fe0b2;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;align-items:start}
.rules .ok{color:var(--green);font-family:var(--mono);font-weight:600}
.why{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--bg-2);border-left:3px solid var(--blue)}
.why .k{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.why p{margin:4px 0 0;color:var(--fg-2)}

/* ---- tech cards / defense flow / try-it ---- */
.techgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:1rem}
.tcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tcard .tt{font-weight:600;color:var(--red);font-size:.95rem}
.tcard p{margin:0;font-size:.82rem;color:var(--fg-2);line-height:1.45}
.mock{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.mock.ok{border-color:var(--green)}
.mock .mbar{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--fg-3);padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.mock .mbody{padding:8px 10px;display:grid;gap:4px}
.mock .ln{font-size:.86rem;line-height:1.4;overflow-wrap:anywhere}
.mock .ln.sub{font-size:.76rem;color:var(--fg-3)}
.mock .ln.code{font-family:var(--mono);font-size:.78rem;color:var(--fg)}
.mock .ln.okk{color:var(--green);font-weight:600;font-size:.84rem}
.mock .ln.hid{color:transparent;background:var(--panel);border:1px dashed var(--line);border-radius:4px;padding:2px 6px;transition:color .25s;user-select:all}
.tcard.rev .ln.hid{color:var(--red);border-color:var(--red)}

  const ph=['Sự kiện','Khái niệm + demo','Kỹ thuật tấn công','Nhận biết + phòng thủ','Thử phòng thủ'];
  return `<div class="eyebrow"${a()}><span class="tag red">${x.id}:2026</span><span>${x.rank}</span></div>
  <div class="item-head"${a()}>
    <div class="name">${x.name}<small>${x.vi}</small></div>
    <div class="phase">${ph.map((p,i)=>`<span class="${i===phase?'cur':''}">${p}</span>`).join('')}</div>
  </div>`}

    </div>

  i=Math.max(0,Math.min(slides.length-1,i));
  if(i===cur)return;
  const dir=i>cur?1:-1;
  if(cur>=0){const o=slides[cur];o.classList.remove('on');o.classList.toggle('out-left',dir>0);}
  const s=slides[i];s.classList.remove('out-left');
  if(dir<0){s.classList.add('out-left');void s.offsetWidth;s.classList.remove('out-left');}
  s.classList.add('on');s.scrollTop=0;
  cur=i;
  cnt.textContent=(i+1)+' / '+slides.length;
  bar.style.width=((i+1)/slides.length*100)+'%';
  if(push)history.replaceState(null,'','#'+s.id);
  updMore();
}
const more=document.getElementById('more');
function updMore(){const s=slides[cur];if(!s)return;more.hidden=!(s.scrollHeight-s.clientHeight>24&&s.scrollTop<s.scrollHeight-s.clientHeight-24)}
addEventListener('resize',updMore);document.getElementById('deck').addEventListener('scroll',updMore,true);
const byId=id=>slides.findIndex(s=>s.id===id);
function goId(id){const i=byId(id);if(i>=0)show(i)}
document.getElementById('prev').onclick=()=>show(cur-1);
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('toc-btn').onclick=()=>goId('toc');
document.querySelectorAll('[data-go]').forEach(b=>{b.onclick=()=>goId(b.dataset.go);const i=byId(b.dataset.go);const p=b.querySelector('.p');if(p)p.textContent=String(i+1).padStart(2,'0')});
document.addEventListener('click',e=>{
 const btn=e.target.closest('.tkbtn');if(!btn)return;
 const card=btn.closest('.tcard'),k=btn.dataset.k;
 if(k==='hid')card.classList.toggle('rev');
 else if(k==='zw')card.querySelectorAll('.zwd').forEach(z=>z.classList.toggle('show'));
 else if(k==='b64'){const o=card.querySelector('.b64out');
  if(o&&!o.dataset.done){o.dataset.done=1;const phrase='ignore '+'previous instructions';
   card.querySelector('.b64s').textContent=btoa(phrase);o.style.display='';o.textContent='→ '+phrase;btn.textContent='✓ đã giải mã'}}
});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(cur+1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(cur-1)}
  else if(e.key==='Home'){show(0)}else if(e.key==='End'){show(slides.length-1)}
  else if(e.key==='m'||e.key==='M'){goId('toc')}
  else if(e.key==='f'||e.key==='F'){(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})}
});
/* touch swipe */
let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(cur+(dx<0?1:-1))});
addEventListener('hashchange',()=>{const i=byId(location.hash.slice(1));if(i>=0)show(i,false)});
/* start */
const start=byId(location.hash.slice(1));
show(start>=0?start:0,false);
</script>
